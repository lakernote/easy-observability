name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: Version in the root POM to publish (for example 0.1.0-alpha.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java and Maven credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD

      - name: Validate release version and prevent duplicate publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          version="$(mvn --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            requested_version="${GITHUB_REF_NAME#v}"
          else
            requested_version="${RELEASE_VERSION}"
          fi
          if [[ "${requested_version}" != "${version}" ]]; then
            echo "Requested version ${requested_version} does not match Maven version ${version}."
            exit 1
          fi
          central_pom="https://repo.maven.apache.org/maven2/io/github/lakernote/easy-observability/${version}/easy-observability-${version}.pom"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --head "${central_pom}")"
          if [[ "${status}" == "200" ]]; then
            echo "Version ${version} is already present in Maven Central and cannot be overwritten."
            exit 1
          elif [[ "${status}" != "404" ]]; then
            echo "Could not verify whether ${version} is already published (HTTP ${status})."
            exit 1
          fi

      - name: Build, sign, and submit to Central Portal
        run: mvn --batch-mode --no-transfer-progress -Pcentral-release -Dgpg.signer=bc clean deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
