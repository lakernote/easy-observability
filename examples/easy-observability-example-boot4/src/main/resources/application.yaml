server:
  port: 8084
spring:
  application:
    name: easy-observability-example-boot4
easy:
  observability:
    web:
      enabled: true
      allow-anonymous: true # 仅用于本机示例，不要在生产环境开放匿名访问。
    trace:
      slow-threshold-ms: 250
      job-slow-threshold-ms: 250
      history-file: ./data/easy-observability-example-boot4/incidents.jsonl
      archive-file: ./data/easy-observability-example-boot4/traces.jsonl
    metrics:
      history:
        storage-dir: ./data/easy-observability-example-boot4/metrics

