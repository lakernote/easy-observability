server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
spring:
  application:
    name: easy-observability-example-spring-boot-3
  datasource:
    url: jdbc:h2:file:./data/easy-observability-example-spring-boot-3/demo-db;AUTO_SERVER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 16379
      connect-timeout: 2s
      timeout: 2s
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: easy-observability-demo-boot3
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
easy:
  observability:
    demo:
      schedule-initial-delay: 5s
      schedule-delay: 30s
      httpbingo-base-url: https://httpbingo.org
    web:
      allow-anonymous: true # 仅用于本机示例，不要在生产环境开放匿名访问。
    trace:
      http-slow-threshold-ms: 250 # 示例 HTTP 阈值，确保异步演示入口进入慢 Trace 列表。
      job-slow-threshold-ms: 250 # 降低示例定时任务阈值，便于快速看到慢任务 Trace。
      cpu-threshold-ms: 100 # 示例 CPU 告警阈值。
      allocated-memory-threshold: 8MB # 示例分配量告警阈值。
      diagnostic-trace-file: ./data/easy-observability-example-spring-boot-3/traces.jsonl
