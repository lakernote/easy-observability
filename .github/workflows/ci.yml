name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The reactor builds the Boot 3 and Boot 4 starters and examples together, so every JDK covers both.
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        if: success() && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            meerkat-spring-boot-3-starter/target/site/jacoco-aggregate/
            meerkat-spring-boot-4-starter/target/site/jacoco-aggregate/
          retention-days: 14

  release-check:
    # Catches javadoc and source-jar failures that would otherwise only surface during publishing.
    name: Release packaging check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package with the release profile
        run: mvn --batch-mode --no-transfer-progress -Pcentral-release -Dgpg.skip -DskipTests clean verify

  minimum-versions:
    # The starters are built against the latest Boot releases; this keeps the documented minimums honest.
    name: Test minimum Spring Boot versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Spring Boot 3.5.0
        run: >-
          mvn --batch-mode --no-transfer-progress -Djacoco.skip=true -Dspring-boot-3.version=3.5.0
          -pl meerkat-spring-boot-3-starter -am clean verify

      - name: Spring Boot 4.0.0
        # redisson-spring-data-41 targets Spring Data Redis 4.1, so its fixture test only runs on Boot 4.1+.
        run: >-
          mvn --batch-mode --no-transfer-progress -Djacoco.skip=true -Dspring-boot-4.version=4.0.0
          -Dtest='!RedissonCommandProviderTracingE2ETest' -Dsurefire.failIfNoSpecifiedTests=false
          -pl meerkat-spring-boot-4-starter -am clean verify
