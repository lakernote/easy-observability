server:
  port: 8084
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
spring:
  application:
    name: meerkat-example-spring-boot-4
  datasource:
    url: jdbc:h2:mem:demo-db;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 16379
      connect-timeout: 2s
      timeout: 2s
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: meerkat-demo-boot4
      auto-offset-reset: earliest
logging:
  pattern:
    correlation: "[%X{meerkatTraceId:-}] "
meerkat:
  demo:
    schedule-initial-delay: 5s
    schedule-delay: 30s
    httpbingo-base-url: https://httpbingo.org
  trace:
    http-slow-threshold: 250ms # 示例 HTTP 阈值，确保异步演示入口进入慢 Trace 列表。
    job-slow-threshold: 250ms # 降低示例定时任务阈值，便于快速看到慢任务 Trace。
    cpu-threshold: 100ms # 示例入口线程 CPU 时间阈值。
    allocated-memory-threshold: 8MB # 示例入口线程内存分配量阈值。
