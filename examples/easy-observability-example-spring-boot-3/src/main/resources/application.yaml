server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
spring:
  application:
    name: easy-observability-example-spring-boot-3
  datasource:
    url: jdbc:h2:file:./data/easy-observability-example-spring-boot-3/demo-db;AUTO_SERVER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 16379
      connect-timeout: 2s
      timeout: 2s
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: easy-observability-demo-boot3
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
easy:
  observability:
    demo:
      schedule-initial-delay: 5s
      schedule-delay: 30s
      httpbingo-base-url: https://httpbingo.org
    web:
      enabled: true
      allow-anonymous: true # 仅用于本机示例，不要在生产环境开放匿名访问。
    trace:
      resource-sampling-enabled: true # 仅为演示线程 CPU/分配数据；生产默认关闭。
      http-slow-threshold-ms: 250
      job-slow-threshold-ms: 250
      executor-task-slow-threshold-ms: 250
      kafka-consumer-slow-threshold-ms: 250
      redis-observation-enabled: true # 由 Lettuce Observation 自动生成 Redis 命令 Span。
      slow-error-trace-file: ./data/easy-observability-example-spring-boot-3/traces.jsonl
